[project]
name = "coffee-hr"
version = "0.1.0"
description = "Example HR MCP server built with FastMCP"
requires-python = ">=3.13"
dependencies = [
    "fastmcp[apps]==4.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["server"]
